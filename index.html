<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sbananas1</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
      color: #d1d5db;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 0;
      padding: 30px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      margin-top: 0;
    }

    .card p {
      color: #4b5563;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 0;
    }

    .button:hover {
      background: #374151;
    }
  </style>
</head>

<body>

  <header>
    <h1>Sbananas1</h1>
    <p>Enjoy!</p>
  </header>

  <main>

    <div class="projects">

      <div class="card">
        <h2>Calculator</h2>

        <p>
          A simple calculator that was my first big project.
        </p>

        <a class="button" href="/Calculator-V2.0/">
          Open Calculator
        </a>
      </div>


      <div class="card">
        <h2>Times Table Quiz</h2>

        <p>
          Test multiplication and division using the 1 to 12 times tables.
        </p>

        <a class="button" href="/times-table-quiz/">
          Start Quiz
        </a>
      </div>

    </div>

  </main>

</body>
</html>
