
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sbananas1 Snake</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #FFD670;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #111827;
    }

    h1 { margin: 15px 0; }

    .game-box {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 15px;
      max-width: 420px;
      margin: 20px auto;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      margin: 15px auto;
      background: #182735;
      border: 2px solid #4ade80;
      border-radius: 5px;
      touch-action: none;
    }

    button, .button {
      background: #facc15;
      color: #111827;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      justify-content: center;
      gap: 8px;
      margin: 15px auto;
    }

    .controls button {
      padding: 15px 0;
      touch-action: manipulation;
    }

    .up { grid-column: 2; }
    .left { grid-column: 1; }
    .down { grid-column: 2; }
    .right { grid-column: 3; }

    .button {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Sbananas1 Snake</h1>

  <div class="game-box">
    <h2>Snake Game</h2>
    <h3>Score: <span id="score">0</span></h3>
    <p id="status">Press Start to play!</p>

    <canvas id="game" width="360" height="360"></canvas>

    <button id="start">Start / Restart</button>

    <div class="controls">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>

    <p>Use arrow keys or the buttons to move.</p>
  </div>

  <a class="button" href="index.html">Back to Homepage</a>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const statusText = document.getElementById("status");

    const size = 20;
    const cells = canvas.width / size;

    let snake, food, direction, nextDirection;
    let score = 0;
    let timer = null;
    let playing = false;

    function placeFood() {
      const empty = [];

      for (let x = 0; x < cells; x++) {
        for (let y = 0; y < cells; y++) {
          if (!snake.some(part => part.x === x && part.y === y)) {
            empty.push({ x, y });
          }
        }
      }

      if (empty.length === 0) {
        food = null;
        return;
      }

      food = empty[Math.floor(Math.random() * empty.length)];
    }

    function draw() {
      ctx.fillStyle = "#182735";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (food) {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(
          food.x * size + size / 2,
          food.y * size + size / 2,
          size / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      if (snake) {
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#a3e635" : "#22c55e";
          ctx.fillRect(
            part.x * size + 1,
            part.y * size + 1,
            size - 2,
            size - 2
          );
        });
      }
    }

    function startGame() {
      clearInterval(timer);

      snake = [
        { x: 8, y: 9 },
        { x: 7, y: 9 },
        { x: 6, y: 9 }
      ];

      direction = "right";
      nextDirection = "right";
      score = 0;
      playing = true;

      scoreText.textContent = score;
      statusText.textContent = "Eat the red food!";
      placeFood();
      draw();

      timer = setInterval(move, 140);
    }

    function changeDirection(newDirection) {
      if (!playing) return;

      const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
      };

      if (newDirection !== opposite[direction]) {
        nextDirection = newDirection;
      }
    }

    function endGame(message) {
      playing = false;
      clearInterval(timer);
      statusText.textContent = message;
    }

    function move() {
      direction = nextDirection;

      const head = { ...snake[0] };

      if (direction === "up") head.y--;
      if (direction === "down") head.y++;
      if (direction === "left") head.x--;
      if (direction === "right") head.x++;

      const eating = food &&
        head.x === food.x &&
        head.y === food.y;

      const body = eating ? snake : snake.slice(0, -1);

      if (
        head.x < 0 || head.x >= cells ||
        head.y < 0 || head.y >= cells ||
        body.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame("Game over! Score: " + score);
        return;
      }

      snake.unshift(head);

      if (eating) {
        score++;
        scoreText.textContent = score;
        placeFood();

        if (!food) {
          endGame("You win! Final score: " + score);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    document.getElementById("start")
      .addEventListener("click", startGame);

    document.querySelectorAll("[data-dir]")
      .forEach(button => {
        button.addEventListener("click", () => {
          changeDirection(button.dataset.dir);
        });
      });

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
      };

      if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
      }
    });

    snake = [
      { x: 8, y: 9 },
      { x: 7, y: 9 },
      { x: 6, y: 9 }
    ];

    placeFood();
    draw();
  </script>

</body>
</html>
