<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Sbananas1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;
      background: #FFD670;
      color: #111827;
    }
    .marketing-choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
    }

    .marketing-choice input {
      width: auto;
      margin-top: 3px;
    }

      .marketing-choice label {
        margin: 0;
        font-weight: normal;
        font-size: 14px;
        line-height: 1.4;
    }    
    .login-box {
      width: min(420px, 100%);
      background: white;
      padding: 36px;

      border-radius: 2px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #4b5563;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #9ca3af;
      border-radius: 2px;

      font: inherit;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;

      border: none;
      border-radius: 2px;

      background: #111827;
      color: white;

      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .create-account {
      margin-top: 10px;

      background: white;
      color: #111827;

      border: 1px solid #111827;
    }

    .create-account:hover {
      background: #f3f4f6;
    }

    #message {
      min-height: 22px;
      margin: 16px 0 0;

      text-align: center;
      color: #b91c1c;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Sbananas1</h1>

    <p class="subtitle">
      Log in to continue
    </p>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Email"
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >
    <div class="marketing-choice">
      <input id="marketing" type="checkbox">

      <label for="marketing">
        I would like to receive occasional emails about new features
        and updates.
      </label>
    </div> 
    
    <button id="login">
      Log in
    </button>

    <button id="signup" class="create-account">
      Create account
    </button>

    <p style="text-align: center; font-size: 13px; color: #4b5563;">
      By creating an account, you agree to our
      <a href="privacy.html">Privacy Policy</a>.
    </p>    
    <p id="message"></p>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBezKNwGhcGjU4pq6Pmp4DVRSLDVVbJAY4",
      authDomain: "sbananas1-project.firebaseapp.com",
      projectId: "sbananas1-project",
      storageBucket: "sbananas1-project.firebasestorage.app",
      messagingSenderId: "1073647022046",
      appId: "1:1073647022046:web:b2ca5ac63a1cd832d3f74f"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const message = document.querySelector("#message");


    // Already logged in check temporarily disabled while testing
    // LOG IN

    document.querySelector("#login").addEventListener("click", async () => {

      const email =
        document.querySelector("#email").value.trim();

      const password =
        document.querySelector("#password").value;

      message.textContent = "";


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;

        // Create/update this user's Firestore record
        await setDoc(
          doc(db, "users", user.uid),
          {
            email: user.email
          },
          { merge: true }
        );

      window.location.replace("index.html");

      }

      catch (error) {

        message.textContent =
          "Incorrect email or password.";

      }

    });


    // CREATE ACCOUNT

    document.querySelector("#signup").addEventListener("click", async () => {

      const email =
        document.querySelector("#email").value.trim();

      const password =
        document.querySelector("#password").value;

      const marketingEmails =
        document.querySelector("#marketing").checked;

      message.textContent = "";

      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {

          email: user.email,

          marketingEmails: marketingEmails,

          accountCreated: serverTimestamp(),

          marketingConsentDate:
              marketingEmails ? serverTimestamp() : null

        });

        window.location.replace("index.html");

      }

      catch (error) {

        console.error(error);

        if (error.code === "auth/email-already-in-use") {

          message.textContent =
            "That email already has an account.";

        }

        else if (error.code === "auth/weak-password") {

          message.textContent =
            "Password must be at least 6 characters.";

        }

        else {

          message.textContent =
            "Could not create account.";

        }

      }

    });


    // Press Enter to log in

    document.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {

        document.querySelector("#login").click();

      }

    });

  </script>

</body>
</html>
